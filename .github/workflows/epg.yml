name: Obnova EPG

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vyrobiť epg.xml.gz
        run: python build_epg.py
      - name: Uložiť zmenu
        run: |
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add epg.xml.gz
          git diff --cached --quiet || git commit -m "EPG $(date -u +%F)"
          git push
